trigger:
- master

pool:
  vmImage: ubuntu-latest

steps:

- checkout: self
  displayName: Checkout WrongSecrets Repository

- script: |
    mkdir -p "$(Build.ArtifactStagingDirectory)/security-reports"
  displayName: Create Security Reports Directory

- script: |
    docker pull securityscanner.azurecr.io/security-scanner:latest
  displayName: Pull Security Scanner Image

- script: |
    docker run --rm \
      -e REPO_NAME=wrongsecrets \
      -v "$(Build.SourcesDirectory):/Project" \
      -v "$(Build.ArtifactStagingDirectory)/security-reports:/vulnerability-reports" \
      securityscanner.azurecr.io/security-scanner:latest
  displayName: Run Security Scanner

- script: |
    echo "Generated reports:"
    find "$(Build.ArtifactStagingDirectory)/security-reports" -type f -print
  displayName: Verify Security Reports

- task: PublishBuildArtifacts@1
  displayName: Publish Security Reports
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/security-reports'
    ArtifactName: 'security-reports'
    publishLocation: 'Container'